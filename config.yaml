# Parámetros por defecto de ClipForge. Los flags de la CLI tienen prioridad.
whisper_model: medium          # tiny | base | small | medium | large-v3
whisper_device: auto           # auto | cpu | cuda
whisper_compute_type: auto     # auto | int8 | float16 ...
language: es
initial_prompt: "Directo de programación en español. Python, JavaScript, TypeScript, React, Node, API, backend, frontend, Git, GitHub, Docker, base de datos, SQL."

clips: 6
min_seconds: 25
max_seconds: 60

# IA que elige los clips:
#   gemini → gratis con GEMINI_API_KEY (https://aistudio.google.com/apikey), sin tarjeta
#   ollama → gratis y local (instala Ollama y haz `ollama pull qwen2.5:7b`)
#   claude → de pago, con ANTHROPIC_API_KEY
#   openai → cualquier API compatible con OpenAI (pon llm_base_url y OPENAI_API_KEY)
llm_provider: gemini
llm_model:                      # vacío = el de por defecto (gemini-3.6-flash, qwen2.5:7b, claude-sonnet-5-5…)
llm_base_url:                   # vacío = la URL por defecto del proveedor
llm_fallback_models:            # vacío = reservas por defecto; si un modelo está saturado se pasa al siguiente
                                # ej.: [gemini-3.5-flash, gemini-flash-lite-latest]
chunk_minutes: 10
chunk_overlap_minutes: 1

output_resolution: [1080, 1920]
loudnorm: false

captions:
  font: Montserrat ExtraBold
  fonts_dir: fonts              # carpeta opcional con .ttf (relativa al proyecto)
  size: 80
  primary_color: "&H00FFFFFF"   # blanco (ASS: &HAABBGGRR)
  highlight_color: "&H0000FFFF" # amarillo
  outline_color: "&H00000000"
  outline: 5
  shadow: 2
  words_per_chunk: 3
  max_chars: 20
  uppercase: true
  margin_v: 620                 # distancia al borde inferior (tercio inferior-medio)

silences:
  enabled: true                 # quitar pausas dentro de cada clip
  max_gap: 0.5                  # pausas de más de 0.5 s se recortan…
  pad: 0.12                     # …dejando 0.12 s de margen a cada lado
  min_segment: 0.2              # tramos aislados más cortos (ruidos) se descartan

layout:
  mode: auto                    # auto | face | split | screen
  small_face: 0.06              # cara < 6% del ancho → webcam superpuesta sobre la pantalla
  flat_screen: 0.45             # % de zonas de color plano a partir del cual se considera pantalla
  camera_ratio: 0.4             # diseño dividido: cámara arriba 40 %, pantalla abajo 60 %
  camera_zoom: 3.2              # recorte de la webcam = 3.2 × ancho de la cara
  screen_height: 1.0            # recorte de pantalla = 100 % del alto (bájalo para más zoom en el código)

reframe:
  sample_fps: 5
  smoothing: 0.15               # alfa de la media móvil exponencial (0-1, menor = más suave)
  dead_zone: 0.06               # fracción del ancho de recorte que la cara puede moverse sin reencuadrar

youtube:
  client_secrets: client_secret.json   # OAuth «App de escritorio» de Google Cloud (ver README)
  token: ~/.config/clipforge/youtube_token.json
  privacy: private                     # private | unlisted | public (programar siempre sube como privado)
  category_id: "28"                    # 28 = Ciencia y tecnología, 27 = Educación
  default_language: es
  add_shorts_tag: true                 # añade #Shorts al título (o a la descripción si no cabe)
  footer: "Directo completo: {source_url}"   # enlace al momento exacto del directo, si vino de YouTube
